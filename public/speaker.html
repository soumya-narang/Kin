<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a0b0e" />
  <title>Kin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%232b6a86'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="device.css" />
</head>
<body class="device">
  <header class="topbar">
    <div class="clock">
      <div class="t" id="clock"></div>
      <div class="d" id="date"></div>
      <div class="owner" id="owner"></div>
    </div>
    <a class="brand" href="/" aria-label="Kin, back to the home page">Kin</a>
    <div class="actions">
      <button class="ghost" id="paceBtn" aria-label="Speaking pace">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 13.5a6.5 6.5 0 1 1 13 0M10 13.5l3-4"/></svg>
        <span class="label" id="paceLabel">Natural pace</span>
      </button>
      <button class="ghost" id="traceBtn" aria-expanded="false" aria-controls="sheet">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5h12M4 10h12M4 13.5h7"/></svg>
        <span class="label">Behind the scenes</span><span class="count" id="count"></span>
      </button>
      <a class="ghost" href="family.html" target="_blank" rel="noopener">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 5H5.8A1.8 1.8 0 0 0 4 6.8v7.4A1.8 1.8 0 0 0 5.8 16h7.4a1.8 1.8 0 0 0 1.8-1.8V12.5M11 4h5v5M16 4l-6.5 6.5"/></svg>
        <span class="label">Family view</span>
      </a>
    </div>
  </header>

  <main class="stage">
    <div class="orb-wrap">
      <button class="orb" id="orb" aria-label="Talk to Kin">
        <span class="halo"></span>
        <span class="body"><span class="sheen"></span></span>
        <span class="ripple"></span><span class="ripple"></span>
      </button>
      <div class="status-line" id="status" aria-live="polite">Tap to talk</div>
    </div>

    <div class="caption" aria-live="polite">
      <p class="you swap" id="you"></p>
      <p class="kin swap" id="kin"></p>
    </div>

    <div class="notified" id="notified" role="status">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 8a4.5 4.5 0 0 1 9 0c0 4 1.5 5 1.5 5h-12s1.5-1 1.5-5ZM8.5 16a1.7 1.7 0 0 0 3 0"/></svg>
      <span id="notifiedText"></span>
    </div>
  </main>

  <footer class="dock">
    <div class="composer" id="composer">
      <form id="composerForm" autocomplete="off">
        <input id="text" placeholder="Type what you would say…" aria-label="Type a message to Kin" tabindex="-1" />
        <button class="send" type="submit" aria-label="Send">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 15.5v-11M5.5 9 10 4.5 14.5 9"/></svg>
        </button>
      </form>
    </div>
    <div class="suggest-label">Try saying</div>
    <div class="chips" id="chips">
      <button>I slept only about four hours</button>
      <button>I took my Metformin after breakfast</button>
      <button>I'm feeling dizzy again, the room is spinning a little</button>
      <button>I think I forgot my BP tablet yesterday</button>
      <button>Remind me to call Priya at 7 in the evening</button>
    </div>
    <button class="ghost" id="typeBtn" aria-expanded="false" aria-controls="composer">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5.5" width="15" height="9" rx="2"/><path d="M5.5 8.5h.01M8.5 8.5h.01M11.5 8.5h.01M14.5 8.5h.01M6.5 11.5h7"/></svg>
      <span>Type instead</span>
    </button>
    <p class="hint" id="hint"></p>
  </footer>

  <aside class="sheet" id="sheet" aria-label="Behind the scenes" aria-hidden="true" inert>
    <header>
      <div>
        <h2>Behind the scenes</h2>
        <p>Every tool Kin calls on the MCP server, as it happens.</p>
      </div>
      <button class="x" id="closeSheet" aria-label="Close">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m3 3 8 8M11 3l-8 8"/></svg>
      </button>
    </header>
    <div class="turns" id="turns"><p class="empty-turns" id="emptyTurns">Tool calls show up here once you talk to Kin.</p></div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
